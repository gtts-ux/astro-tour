name: Release Windows
on:
  push:
    tags: ['v*-windows']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Ensure Electron runtime is downloaded
        run: node node_modules/electron/install.js
      - run: npm test
      - name: Compile native Windows location helper
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $source = Join-Path $PWD 'native\Location.Windows.cs'
          $output = Join-Path $PWD 'native\AstroTourLocation.exe'
          & $compiler /nologo /target:exe /platform:x64 /reference:System.Device.dll "/out:$output" $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./native/AstroTourLocation.exe --diagnose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged Windows application
        run: npm run test:desktop
        env:
          ASTRO_EXECUTABLE: ${{ github.workspace }}/release/windows/win-unpacked/Astro Tour.exe
      - name: Collect downloads and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          Copy-Item release/windows/*.exe,release/windows/*.zip assets/
          Get-ChildItem assets -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content -Encoding utf8 assets/SHA256SUMS-Windows.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Astro-Tour-Windows
          path: assets/*
          if-no-files-found: error
      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create $env:TAG --verify-tag --title "Astro Tour 1.2.1 — Windows" --notes-file .github/release-windows.md --latest=false (Get-ChildItem assets/* | ForEach-Object FullName)

name: Release macOS
on:
  push:
    tags: ['v*-macos']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run build:mac
        env:
          ASTRO_ARCH: ${{ matrix.arch }}
      - name: Test packaged macOS application
        run: npm run test:desktop
        env:
          ASTRO_EXECUTABLE: ${{ github.workspace }}/release/Astro Tour-darwin-${{ matrix.arch }}/Astro Tour.app/Contents/MacOS/Astro Tour
      - name: Archive application
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p assets
          ditto -c -k --sequesterRsrc --keepParent "release/Astro Tour-darwin-$ARCH/Astro Tour.app" "assets/Astro-Tour-$VERSION-macOS-$ARCH.zip"
          cd assets
          shasum -a 256 *.zip > "SHA256SUMS-macOS-$ARCH.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Astro-Tour-macOS-${{ matrix.arch }}
          path: assets/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Astro-Tour-macOS-*
          path: assets
          merge-multiple: true
      - name: Publish macOS release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "Astro Tour 1.4.1 — macOS" --notes-file .github/release-macos.md --latest assets/*
